<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Digital Notary & Audit Trail</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <div>
                    <h2>The Digital Notary</h2>
                    <small style="color: #94a3b8"
                        >Client Thread + Isolated Web Worker (Central
                        Authority)</small
                    >
                </div>
                <span id="worker-badge" class="badge">INITIALIZING</span>
            </header>

            <!-- Operational Controls -->
            <div class="card controls">
                <select id="select-algo">
                    <option value="ECDSA">ECDSA (P-256)</option>
                    <option value="RSA-PSS">RSA-PSS (4096)</option>
                </select>

                <button id="btn-sign" disabled>Sign Document</button>
                <button id="btn-tamper" class="danger">Simulate Attack</button>
                <button id="btn-verify-chain" class="success">
                    Verify Chain
                </button>
            </div>

            <!-- The Ordered Ledger Table -->
            <div class="card">
                <h3 style="font-size: 14px">Ordered Audit Log</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Seq</th>
                            <th>Digest</th>
                            <th>Signature</th>
                            <th>Chain Hash</th>
                            <th>Audit</th>
                        </tr>
                    </thead>
                    <tbody id="log-rows">
                        <tr>
                            <td
                                colspan="5"
                                style="text-align: center; color: #64748b"
                            >
                                No documents signed yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Console Output -->
            <div class="card">
                <h3 style="font-size: 14px; margin-bottom: 6px">
                    Execution Terminal
                </h3>
                <pre id="console-output">Awaiting worker startup...</pre>
            </div>
        </div>

        <script type="module" src="main.js"></script>
    </body>
</html>
